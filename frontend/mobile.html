<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#12366c"/><title>弓行记 · Gongxingji</title><link rel="stylesheet" href="/src/mobile/brand-loading.css"/></head><body><div id="root"><main id="initial-loading" class="brand-loading" aria-label="正在打开弓行记"><div class="brand-loading-center"><img class="brand-loading-logo" src="./public/ui/logo-mark.png" alt="弓行记" width="108" height="108"/><p class="brand-loading-slogan">记录每一箭，看见每一次进步</p></div><div id="initial-recovery" class="brand-loading-recovery" role="status" hidden><p>暂时未能打开。请检查网络后重试，已保存的记录仍保留。</p><button id="initial-retry" type="button">重新打开</button></div><noscript><p>请启用 JavaScript 后重新打开。</p></noscript></main></div><script>setTimeout(function(){var page=document.getElementById('initial-loading'),recovery=document.getElementById('initial-recovery');if(page&&recovery){page.classList.add('brand-loading-stalled');recovery.hidden=false;}},15000);document.getElementById('initial-retry').addEventListener('click',function(){window.location.reload();});</script><script type="module" src="/src/mobile/main.tsx"></script></body></html>
