[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archery-training-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110,<1.0", "sqlalchemy>=2.0,<3.0", "alembic>=1.13,<2.0", "uvicorn[standard]>=0.27,<1.0", "psycopg[binary]>=3.2,<4.0", "PyJWT[crypto]>=2.10,<3.0", "alibabacloud-dypnsapi20170525==2.0.0", "alibabacloud-tea-openapi==0.4.6", "darabonba-core==1.0.9", "aiohttp==3.14.5", "alibabacloud-openapi-util==0.2.4", "alibabacloud-tea-util==0.3.15", "alibabacloud-credentials==1.0.12", "aiohappyeyeballs==2.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
sms_hook = ["alibabacloud-dypnsapi20170525==2.0.0", "alibabacloud-tea-openapi==0.4.6", "darabonba-core==1.0.9", "aiohttp==3.14.5", "alibabacloud-openapi-util==0.2.4", "alibabacloud-tea-util==0.3.15", "alibabacloud-credentials==1.0.12", "aiohappyeyeballs==2.7.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
